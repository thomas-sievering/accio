packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
# pnpm holds back releases younger than a day. Anthropic's packages (the Agent SDK
# and its API client) are first-party and bumped often, so a lockfile on a fresh
# build would block every new worktree's install until the day passed.
minimumReleaseAgeExclude:
  - '@anthropic-ai/*'
