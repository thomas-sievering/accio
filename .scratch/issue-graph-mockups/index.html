<!doctype html>
<!-- PROTOTYPE, throwaway: issue dependency view mockups. Switch with ?v=a|b|c|d -->
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Issue graph</title>
<style>
:root{--bg:#18191d;--side:#101115;--panel:#1b1c20;--raised:#202125;--raised-2:#28292d;--code:#141519;--hover:#1f2024;--active:#262628;--line:#26272b;--line-2:#34353a;--ink:#c8c9cd;--ink-strong:#dedfe3;--muted:#9a9ba3;--dim:#8f9099;--green:#6bc694;--blue:#8b9db8;--amber:#bca777;--orange:#e6ad48;--red:#c47f84;color-scheme:dark;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{margin:0;background:#0c0d10;color:var(--ink);font:14px/1.45 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;padding:24px}
button{color:inherit;font:inherit;background:none;border:0;padding:0;cursor:pointer}
code{font-family:'Cascadia Code',Consolas,monospace;font-size:12.5px}
#view{width:1120px;height:660px;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.top h1{font-size:14px;font-weight:600;color:var(--ink-strong);margin:0}
.top .src{color:var(--dim);font-size:12.5px}
.top .sp{flex:1}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg span{padding:3px 10px;border-radius:5px;font-size:12.5px;color:var(--muted)}
.seg span.on{background:var(--active);color:var(--ink-strong)}
.body{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;overflow:auto;position:relative}
.num{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.s-done{background:var(--dim);opacity:.6}.s-ready{background:var(--green)}.s-blocked{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber)}.s-claimed{background:var(--blue)}
.pill{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.ready{color:var(--green);border-color:#2f4a3b}.pill.blocked{color:var(--amber);border-color:#4a4330}.pill.claimed{color:var(--blue);border-color:#38404d}.pill.done{color:var(--dim)}
.chip{font-size:12px;color:var(--muted);background:var(--raised);border-radius:4px;padding:0 5px}
.chip.open{color:var(--amber)}
/* reader */
.reader{width:400px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 20px}
.rd .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rd h2{font-size:16px;font-weight:600;color:var(--ink-strong);margin:0 0 12px;line-height:1.3}
.rd .rel{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:12.5px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
.rd .rel dt{color:var(--dim)} .rd .rel dd{margin:0;display:flex;flex-wrap:wrap;gap:4px 10px}
.rd .rel a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.rd .md{font-size:13.5px;color:var(--ink)} .rd .md h4{font-size:13px;color:var(--ink-strong);margin:14px 0 4px} .rd .md p{margin:0 0 8px} .rd .md ul{margin:0 0 8px;padding-left:18px}
.rd .actions{display:flex;gap:8px;margin-top:14px}
.btn{padding:5px 12px;border-radius:6px;font-size:13px;border:1px solid var(--line-2);color:var(--ink)}
.btn.primary{background:var(--ink-strong);color:#111;border-color:transparent;font-weight:500}
.close{margin-left:auto;color:var(--dim)}
/* A: list */
.grp{padding:14px 18px 4px;font-size:12px;color:var(--dim);display:flex;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:7px 18px;cursor:pointer}
.row:hover{background:var(--hover)} .row.sel{background:var(--active)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-strong)}
.row.done .t{color:var(--dim)}
.row .deps{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--dim)}
/* B: layered graph */
.dag{position:relative;padding:24px}
.node{position:absolute;width:190px;background:var(--raised);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12.5px}
.node:hover{border-color:#4a4b52}.node.sel{border-color:var(--ink-strong);box-shadow:0 0 0 3px #ffffff14}
.node .h{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.node .tt{color:var(--ink-strong);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.done{opacity:.55}
.node.dim{opacity:.3}
.colh{position:absolute;top:10px;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.legend{position:absolute;left:18px;bottom:14px;display:flex;gap:14px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* C: focus */
.focus{display:grid;grid-template-columns:1fr 440px 1fr;gap:0;height:100%;align-items:start;padding:28px 22px}
.side h5{margin:0 0 10px;font-size:11.5px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.side .mini{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:var(--panel);cursor:pointer;font-size:12.5px}
.side .mini:hover{border-color:var(--line-2)} .side .mini .tt{flex:1;color:var(--ink-strong)}
.side.l{padding-right:26px;position:relative}.side.r{padding-left:26px;position:relative}
.center{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:16px 18px;max-height:600px;overflow:auto}
.center h2{font-size:16px;margin:4px 0 10px;color:var(--ink-strong);font-weight:600}
.crumbs{font-size:12px;color:var(--dim);margin-bottom:6px}
.crumbs b{color:var(--muted);font-weight:500}
.side .more{font-size:12px;color:var(--dim);padding:2px 10px}
.side .empty{font-size:12.5px;color:var(--dim);padding:8px 10px;border:1px dashed var(--line-2);border-radius:7px}
/* D: gutter graph */
.glist{position:relative}
.grow{display:flex;align-items:center;height:40px;cursor:pointer;padding-right:18px}
.grow:hover{background:var(--hover)}.grow.sel{background:var(--active)}
.grow .gut{flex:none}
.grow .t{flex:1;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow.done .t{color:var(--dim)}
.grow .r{display:flex;gap:8px;align-items:center}
.hdr{display:flex;font-size:11.5px;color:var(--dim);padding:8px 18px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#000;padding:4px;border-radius:8px}
.switch a{color:#aaa;padding:4px 10px;text-decoration:none;border-radius:5px;font-size:12px}.switch a.on{background:#333;color:#fff}
</style>
</head>
<body>
<div id="view"></div>
<div class="switch" id="switch"></div>
<script>
const issues = [
  {n:210,t:'Read issue dependencies from the tracker',s:'done',by:[],label:'ready-for-agent'},
  {n:211,t:'Parse "Blocked by" lines in local issue files',s:'done',by:[210],label:'ready-for-agent'},
  {n:212,t:'Fetch GitHub blocking links for open issues',s:'claimed',by:[210],label:'ready-for-agent',thread:'fetch-github-blocking-links'},
  {n:214,t:"Open an issue's body in a side sheet",s:'ready',by:[210],label:'ready-for-agent'},
  {n:216,t:'Show which thread claimed an issue',s:'ready',by:[],label:'ready-for-agent'},
  {n:213,t:'Issue graph panel on the project dashboard',s:'blocked',by:[211,212],label:'ready-for-agent'},
  {n:215,t:'Start a thread from an issue in the graph',s:'blocked',by:[213,214],label:'needs-triage'},
  {n:217,t:'Verify recipe for the issue graph',s:'blocked',by:[215],label:'ready-for-agent'},
];
const byN = Object.fromEntries(issues.map(i=>[i.n,i]));
const blocks = n => issues.filter(i=>i.by.includes(n)).map(i=>i.n);
const statusText = {done:'Closed',ready:'Ready',blocked:'Blocked',claimed:'Claimed'};
const params = new URLSearchParams(location.search);
const v = params.get('v') || 'a';
let sel = Number(params.get('sel') || 213);
const noReader = params.get('reader') === '0';

function body(i){
  if(i.n===213) return `<h4>What to build</h4><p>A panel on the project dashboard that draws the project's open issues and the links between them, so you can see what's ready to start and what's waiting.</p>
  <h4>Acceptance criteria</h4><ul><li>Each issue shows its number, title and whether it's ready, blocked, claimed or closed.</li><li>Clicking an issue opens its body without leaving the dashboard.</li><li>Works for GitHub issues and local files under <code>.scratch/</code>.</li></ul>
  <h4>Blocked by</h4><p>#211, #212</p>`;
  return `<p>${i.t}.</p><h4>Acceptance criteria</h4><ul><li>Covered by a test at the tracker seam.</li><li>Shown in the issue picker as well.</li></ul>`;
}
function link(n){const i=byN[n];return `<a href="#" data-n="${n}"><span class="dot s-${i.s}"></span><span class="num">#${n}</span> ${i.t.length>34?i.t.slice(0,32)+'…':i.t}</a>`}
function reader(i, opts={}){
  const bl = blocks(i.n);
  return `<div class="meta"><span class="num">#${i.n}</span><span class="pill ${i.s}">${statusText[i.s]}${i.s==='blocked'?` · ${i.by.filter(n=>byN[n].s!=='done').length} open`:''}</span><span class="chip">${i.label}</span>${opts.close===false?'':'<button class="close" title="Close">✕</button>'}</div>
  <h2>${i.t}</h2>
  <dl class="rel"><dt>Blocked by</dt><dd>${i.by.length?i.by.map(link).join(''):'<span class="num">Nothing</span>'}</dd><dt>Blocks</dt><dd>${bl.length?bl.map(link).join(''):'<span class="num">Nothing</span>'}</dd></dl>
  <div class="md">${body(i)}</div>
  <div class="actions">${i.s==='ready'?'<button class="btn primary">Start a thread</button>':i.s==='claimed'?`<button class="btn">Open thread</button>`:'<button class="btn" disabled style="opacity:.5">Start a thread</button>'}<button class="btn">View on GitHub ↗</button></div>`;
}
function shell(title, inner, right){
  return `<div class="top"><h1>Issues</h1><span class="src">thomas-sievering/accio · 8 open in "Issue graph"</span><span class="sp"></span>${right||''}</div><div class="body">${inner}</div>`;
}
const seg = on => `<div class="seg"><span class="${on==='list'?'on':''}">List</span><span class="${on==='graph'?'on':''}">Graph</span></div>`;

// ---------- A: grouped list ----------
function A(){
  const groups=[['Ready to start',i=>i.s==='ready'],['In progress',i=>i.s==='claimed'],['Blocked',i=>i.s==='blocked'],['Closed',i=>i.s==='done']];
  const rows = groups.map(([g,f])=>{const list=issues.filter(f);if(!list.length)return'';return `<div class="grp">${g} <span>${list.length}</span></div>`+list.map(i=>{
    const open=i.by.filter(n=>byN[n].s!=='done');
    const deps = i.s==='blocked'?`<span class="deps">waits on ${open.map(n=>`<span class="chip open">#${n}</span>`).join('')}</span>`:
      blocks(i.n).length&&i.s!=='done'?`<span class="deps">unblocks ${blocks(i.n).map(n=>`<span class="chip">#${n}</span>`).join('')}</span>`:'';
    return `<div class="row ${i.n===sel?'sel':''} ${i.s}" data-n="${i.n}"><span class="dot s-${i.s}"></span><span class="num">#${i.n}</span><span class="t">${i.t}</span>${deps}</div>`}).join('')}).join('');
  return shell('',`<div class="main">${rows}</div>${noReader?'':`<aside class="reader rd">${reader(byN[sel])}</aside>`}`, seg('list'));
}

// ---------- B: layered DAG ----------
function depth(n){const i=byN[n];return i.by.length?1+Math.max(...i.by.map(depth)):0}
function B(){
  const cols={};issues.forEach(i=>{const d=depth(i.n);(cols[d]=cols[d]||[]).push(i)});
  const W=190,H=58,GX=22,GY=40,X0=6,Y0=0;const pos={};
  const order={0:[210,216],1:[211,212,214],2:[213],3:[215],4:[217]};
  const xslot={210:1,216:2,211:0,212:1,214:2,213:0.5,215:1.25,217:1.25};
  Object.entries(order).forEach(([d,ns])=>ns.forEach(n=>pos[n]={x:X0+xslot[n]*(W+GX),y:Y0+d*(H+GY)}));
  // highlight chain of selected
  const up=new Set,down=new Set;const walkU=n=>byN[n].by.forEach(b=>{up.add(b);walkU(b)});const walkD=n=>blocks(n).forEach(b=>{down.add(b);walkD(b)});walkU(sel);walkD(sel);
  const related=n=>n===sel||up.has(n)||down.has(n);
  let paths='';issues.forEach(i=>i.by.forEach(b=>{const a=pos[b],c=pos[i.n];const x1=a.x+W/2,y1=a.y+H,x2=c.x+W/2,y2=c.y,my=(y1+y2)/2;
    const hot=related(b)&&related(i.n);const col=byN[b].s==='done'?'#3a3b41':hot?'#9a9ba3':'#4a4b52';
    paths+=`<path d="M${x1} ${y1} C${x1} ${my},${x2} ${my},${x2} ${y2}" stroke="${col}" stroke-width="${hot?1.6:1.2}" fill="none" ${byN[b].s==='done'?'stroke-dasharray="3 3"':''} marker-end="url(#ar${hot?'h':''})"/>`}));
  const heads=['Start here','','','',''].map((h,d)=>h?`<div class="colh" style="left:${X0+d*(W+GX)+24}px">${h}</div>`:'').join('');
  const nodes=issues.map(i=>`<div class="node ${i.s==='done'?'done':''} ${i.n===sel?'sel':''} ${!related(i.n)&&i.s!=='done'?'dim':''}" data-n="${i.n}" style="left:${pos[i.n].x+24}px;top:${pos[i.n].y+24}px"><div class="h"><span class="dot s-${i.s}"></span><span class="num">#${i.n}</span>${i.thread?'<span class="num" style="margin-left:auto">● thread</span>':''}</div><div class="tt">${i.t}</div></div>`).join('');
  const svg=`<svg class="edges" style="left:24px;top:24px" width="1200" height="600"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4a4b52"/></marker><marker id="arh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9a9ba3"/></marker></defs>${paths}</svg>`;
  const legend=`<div class="legend"><span><i class="dot s-ready"></i>Ready</span><span><i class="dot s-claimed"></i>Claimed</span><span><i class="dot s-blocked"></i>Blocked</span><span><i class="dot s-done"></i>Closed</span><span>Arrows point to what an issue unblocks</span></div>`;
  return shell('',`<div class="main"><div class="dag">${svg}${nodes}</div>${legend}</div>${noReader?'':`<aside class="reader rd">${reader(byN[sel])}</aside>`}`, seg('graph'));
}

// ---------- C: focus / neighbourhood ----------
function C(){
  const i=byN[sel];const bl=blocks(i.n);
  const mini=n=>{const j=byN[n];return `<div class="mini" data-n="${n}"><span class="dot s-${j.s}"></span><span class="num">#${n}</span><span class="tt">${j.t}</span></div>`};
  const left=`<div class="side l"><h5>Waits on →</h5>${i.by.length?i.by.map(mini).join(''):'<div class="empty">Nothing: ready to start</div>'}${i.by.flatMap(n=>byN[n].by).length?`<div class="more">↑ ${[...new Set(i.by.flatMap(n=>byN[n].by))].map(n=>'#'+n).join(', ')} further back</div>`:''}</div>`;
  const right=`<div class="side r"><h5>→ Unblocks</h5>${bl.length?bl.map(mini).join(''):'<div class="empty">Nothing waits on this</div>'}${bl.flatMap(blocks).length?`<div class="more">then ${[...new Set(bl.flatMap(blocks))].map(n=>'#'+n).join(', ')} →</div>`:''}</div>`;
  const center=`<div class="center rd"><div class="crumbs">Path: <b>#210</b> → <b>#212</b> → <b style="color:var(--ink-strong)">#${i.n}</b></div>${reader(i,{close:false})}</div>`;
  const svg=`<svg class="edges" width="1120" height="600" style="left:0;top:0"></svg>`;
  return shell('',`<div class="main"><div class="focus">${left}${center}${right}</div></div>`, `<span class="src">Click a neighbour to move to it</span>`+seg('graph'));
}

// ---------- D: list with commit-graph gutter ----------
function D(){
  const order=[210,211,212,214,213,215,217,216];const lane={210:0,211:0,212:1,214:2,213:0,215:0,217:0,216:3};
  const RH=40,LW=16,G0=22,gw=G0+4*LW+6;const row=Object.fromEntries(order.map((n,k)=>[n,k]));
  const cx=n=>G0+lane[n]*LW, cy=n=>row[n]*RH+RH/2;
  const early={'210>212':1,'210>214':1,'212>213':1};
  let p='';issues.forEach(i=>i.by.forEach(b=>{const x1=cx(b),y1=cy(b),x2=cx(i.n),y2=cy(i.n);let d;
    if(x1===x2)d=`M${x1} ${y1}L${x2} ${y2}`;else if(early[b+'>'+i.n])d=`M${x1} ${y1}C${x1} ${y1+RH*.6},${x2} ${y1+RH*.4},${x2} ${y1+RH}L${x2} ${y2}`;
    else d=`M${x1} ${y1}L${x1} ${y2-RH}C${x1} ${y2-RH*.4},${x2} ${y2-RH*.6},${x2} ${y2}`;
    p+=`<path d="${d}" stroke="${byN[b].s==='done'?'#3a3b41':'#5a5b62'}" stroke-width="1.5" fill="none"/>`}));
  const fill={done:'#5b5c63',ready:'#6bc694',claimed:'#8b9db8',blocked:'#18191d'};
  const dots=order.map(n=>`<circle cx="${cx(n)}" cy="${cy(n)}" r="5" fill="${fill[byN[n].s]}" stroke="${byN[n].s==='blocked'?'#bca777':'none'}" stroke-width="1.5"/>`).join('');
  const rows=order.map(n=>{const i=byN[n];const open=i.by.filter(x=>byN[x].s!=='done');return `<div class="grow ${n===sel?'sel':''} ${i.s}" data-n="${n}"><span class="gut" style="width:${gw}px"></span><span class="num" style="width:44px">#${n}</span><span class="t">${i.t}</span><span class="r">${i.thread?'<span class="num">● '+i.thread+'</span>':''}${open.length?`<span class="num">waits on ${open.map(x=>'#'+x).join(' ')}</span>`:''}<span class="pill ${i.s}">${statusText[i.s]}</span></span></div>`}).join('');
  return shell('',`<div class="main"><div class="hdr"><span style="width:${gw+44-18}px">Order</span><span>Issue</span></div><div class="glist"><svg class="edges" width="${gw}" height="${order.length*RH}" style="top:0;left:0">${p}${dots}</svg>${rows}</div></div>${noReader?'':`<aside class="reader rd">${reader(byN[sel])}</aside>`}`, seg('list'));
}

const views={a:A,b:B,c:C,d:D};
function render(){document.getElementById('view').innerHTML=views[v]();
  document.querySelectorAll('[data-n]').forEach(el=>el.onclick=e=>{e.preventDefault();sel=Number(el.dataset.n);render()});}
render();
document.getElementById('switch').innerHTML=Object.keys(views).map(k=>`<a href="?v=${k}" class="${k===v?'on':''}">${k.toUpperCase()}</a>`).join('');
</script>
</body>
</html>
