name: Hub image
on:
  # Branches run through their pull request; only main runs on push.
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - tests/**
      - scripts/**
      - playwright*.config.ts
      - .agents/skills/3-verify/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vitest.config.ts
      - Dockerfile.hub
      - .dockerignore
      - .github/workflows/hub.yml
  pull_request:
    paths:
      - apps/**
      - packages/**
      - tests/**
      - scripts/**
      - playwright*.config.ts
      - .agents/skills/3-verify/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vitest.config.ts
      - Dockerfile.hub
      - .dockerignore
      - .github/workflows/hub.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Every main commit keeps its own run: Ship waits for its revision's checks, and a newer push
  # cancelling them sent it chasing main's tip. Other branches still cancel superseded runs.
  group: hub-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Versions are frozen by the reviewed lockfile, including the current SDK release.
      - run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile --ignore-scripts
      - run: pnpm --config.minimumReleaseAge=0 typecheck
      - run: pnpm --config.minimumReleaseAge=0 test
        env:
          # Disposable encryption backend for isolated Linux test homes.
          ACCIO_SECRET_KEY: KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio=
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile --ignore-scripts
      - run: node scripts/ensure-electron.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: xvfb-run --auto-servernum pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            out/e2e/chat/
            out/e2e/limits/
          retention-days: 7
  image:
    # Deploys pull only main's images, so pull requests skip the build.
    if: github.event_name != 'pull_request'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the Accio version counts its commits.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/accio-hub"
          protocol="$(sed -n 's/^export const HUB_PROTOCOL = \([0-9]*\);/\1/p' apps/hub/src/service.ts)"
          test -n "$protocol"
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # Main runs overlap now, so only the newest main commit moves the stable tag.
          if [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]; then echo "$image:stable-v$protocol" >> "$GITHUB_OUTPUT"; fi
          echo TAGS >> "$GITHUB_OUTPUT"
          # GLOSSARY: Accio version, as apps/worker/src/machine/checkout.ts counts it.
          echo "version=0.1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PNPM_MINIMUM_RELEASE_AGE=0
            ACCIO_VERSION=${{ steps.tags.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
