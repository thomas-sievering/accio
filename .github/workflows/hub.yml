name: Hub image
on:
  push:
    paths:
      - apps/**
      - packages/**
      - tests/**
      - scripts/**
      - playwright*.config.ts
      - .agents/skills/3-verify/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vitest.config.ts
      - Dockerfile.hub
      - .dockerignore
      - .github/workflows/hub.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Versions are frozen by the reviewed lockfile, including the current SDK release.
      - run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile --ignore-scripts
      - run: pnpm --config.minimumReleaseAge=0 typecheck
      - run: pnpm --config.minimumReleaseAge=0 test
        env:
          # Disposable encryption backend for isolated Linux test homes.
          ACCIO_SECRET_KEY: KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio=
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile --ignore-scripts
      - run: node scripts/ensure-electron.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: xvfb-run --auto-servernum pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            out/e2e/chat/
            out/e2e/limits/
          retention-days: 7
  image:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/accio-hub"
          protocol="$(sed -n 's/^export const HUB_PROTOCOL = \([0-9]*\);/\1/p' apps/hub/src/service.ts)"
          test -n "$protocol"
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "$image:stable-v$protocol" >> "$GITHUB_OUTPUT"; fi
          echo TAGS >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: PNPM_MINIMUM_RELEASE_AGE=0
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
