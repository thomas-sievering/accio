name: Sorting Hat image
on:
  # Branches run through their pull request; only main runs on push.
  push:
    branches: [main]
    paths:
      - apps/sorting-hat/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vitest.config.ts
      - Dockerfile.sorting-hat
      - .dockerignore
      - .github/workflows/sorting-hat.yml
  pull_request:
    paths:
      - apps/sorting-hat/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vitest.config.ts
      - Dockerfile.sorting-hat
      - .dockerignore
      - .github/workflows/sorting-hat.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # As in hub.yml: every main commit keeps its own run; other branches cancel superseded runs.
  group: sorting-hat-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Versions are frozen by the reviewed lockfile, including the current Codex release.
      - run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile --ignore-scripts
      - run: pnpm --config.minimumReleaseAge=0 --filter '@accio/sorting-hat...' build
      - run: pnpm exec vitest run apps/sorting-hat
  image:
    # Deploys pull only main's images, so pull requests skip the build.
    if: github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/accio-sorting-hat"
          # The deployment tag follows the state format: a release that converts sorting-hat.json
          # moves to a new tag, since rolling back the image cannot undo the conversion.
          state="$(sed -n 's/^export type HatState = { version: \([0-9]*\);.*/\1/p' apps/sorting-hat/src/state.ts)"
          test -n "$state"
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # Main runs overlap, so only the newest main commit moves the stable tag.
          if [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]; then echo "$image:stable-v$state" >> "$GITHUB_OUTPUT"; fi
          echo TAGS >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sorting-hat
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PNPM_MINIMUM_RELEASE_AGE=0
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=sorting-hat
          cache-to: type=gha,mode=max,scope=sorting-hat
